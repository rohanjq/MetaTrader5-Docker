services:
  mt5-tester:
    build:
      context: .
      dockerfile: Dockerfile
    image: mt5-docker
    container_name: mt5-tester
    # Keep container UID 1000 aligned with the WSL user.  Starting as root is
    # still required so the linuxserver init can prepare /config and /data.
    userns_mode: keep-id
    user: "0:0"
    volumes:
      - ./config-tester:/config
      - ./data-tester:/data
      - ${MT5_CONFIG_FILE:-./presets/8-aggressive-proven.yaml}:/mt5-config/config.yaml:ro
    ports:
      - 3001:3000
      - 8002:8001
    env_file:
      - .env
    environment:
      - UPDATE_PACKAGES=false
      - MT5_MODE=tester
    security_opt:
      - seccomp=unconfined
      - label=disable
