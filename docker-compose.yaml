services:
  mt5:
    build:
      context: .
      dockerfile: Dockerfile
    image: mt5-docker
    container_name: mt5
    # Keep container UID 1000 aligned with the WSL user.  Starting as root is
    # still required so the linuxserver init can prepare /config and /data.
    userns_mode: keep-id
    user: "0:0"
    volumes:
      - ./config:/config
      - ./data:/data
      - ${MT5_CONFIG_FILE:-./presets/8-aggressive-proven.yaml}:/mt5-config/config.yaml:ro
    ports:
      - 3000:3000
      - 8001:8001
      - 18080:18080
    env_file:
      - .env
    environment:
      - UPDATE_PACKAGES=false
    security_opt:
      - seccomp=unconfined
      - label=disable
